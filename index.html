<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Chain - Trí Tuệ Vô Cực</title>
    <style>
        /* --- CÀI ĐẶT CHUNG --- */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; overflow-x: hidden; background-color: #1a1a2e; color: white; }
        
        .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* =========================================
           1. GIAO DIỆN SẢNH CHỜ (LOBBY)
           ========================================= */
        #lobby-screen { background: radial-gradient(circle at center, #16213e 0%, #0f3460 100%); position: relative; }
        .game-title { font-size: 60px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; background: linear-gradient(45deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0px 10px 20px rgba(0, 242, 254, 0.3); }
        .subtitle { font-size: 20px; color: #a9cce3; margin-bottom: 50px; letter-spacing: 2px; }
        .btn-play-now { padding: 18px 50px; font-size: 24px; font-weight: bold; text-transform: uppercase; color: #fff; background: linear-gradient(45deg, #f1c40f, #e67e22); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(241, 196, 15, 0.5); transition: 0.3s; animation: pulse 2s infinite; }
        .btn-play-now:hover { transform: scale(1.1); box-shadow: 0 0 40px rgba(241, 196, 15, 0.8); }
        @keyframes pulse { 0% { box-shadow: 0 0 20px rgba(241, 196, 15, 0.5); } 50% { box-shadow: 0 0 40px rgba(241, 196, 15, 0.8), 0 0 60px rgba(241, 196, 15, 0.4); } 100% { box-shadow: 0 0 20px rgba(241, 196, 15, 0.5); } }

        /* =========================================
           2. GIAO DIỆN BẢN ĐỒ KHO BÁU (LEVEL SELECT)
           ========================================= */
        #map-screen { background-color: #e8dcb8; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%, rgba(0,0,0,0.02)), repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%, rgba(0,0,0,0.02)); background-position: 0 0, 20px 20px; background-size: 40px 40px; color: #5c4033; justify-content: flex-start; padding: 40px 20px; }
        .map-header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; margin-bottom: 40px; }
        .map-title { font-size: 32px; font-weight: bold; border-bottom: 3px dashed #5c4033; padding-bottom: 10px; margin: 0;}
        .map-path-container { position: relative; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 50px; }
        .map-path-container::before { content: ''; position: absolute; top: 30px; bottom: 30px; left: 50%; transform: translateX(-50%); width: 4px; border-left: 4px dashed #8b5a2b; z-index: 1; }
        .level-node { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; cursor: pointer; z-index: 2; position: relative; background: #f1c40f; color: #d35400; border: 4px solid #d35400; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s; }
        .level-node:nth-child(odd) { transform: translateX(-60px); }
        .level-node:nth-child(even) { transform: translateX(60px); }
        .level-node:hover:not(.locked) { transform: scale(1.1) translateX(calc(var(--offset) * 1.1)); background: #f39c12; }
        .level-node.locked { background: #95a5a6; border-color: #7f8c8d; color: #fff; cursor: not-allowed; box-shadow: none; }
        .level-node.locked::after { content: '🔒'; font-size: 28px; position: absolute; }
        .level-node.locked span { display: none; } 
        .btn-back { padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* =========================================
           3. GIAO DIỆN TRONG GAME (GAME SCREEN)
           ========================================= */
        #game-screen { background: radial-gradient(circle at top, #2c3e50 0%, #1a1a2e 100%); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(0, 0, 0, 0.2); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        #level-title { color: #00f2fe; margin: 0; font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        #hint-btn { background: linear-gradient(135deg, #f1c40f, #e67e22); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4); }
        #hint-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(241, 196, 15, 0.6); }
        #hint-btn:disabled { background: #7f8c8d; cursor: not-allowed; box-shadow: none; color: #bdc3c7; }
        
        #game-board { display: grid; gap: 8px; margin-top: 10px; background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        
        .cell {
            background: linear-gradient(135deg, #34495e, #2c3e50); border: none; border-bottom: 4px solid #1a252f; border-radius: 14px;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.1s ease-out; box-shadow: 0 6px 10px rgba(0,0,0,0.3); color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            /* Bẻ dòng và căn giữa khi có nhiều mũi tên */
            flex-wrap: wrap; text-align: center; line-height: 1; word-break: break-all;
        }
        .cell:hover:not(.empty-cell) { background: linear-gradient(135deg, #3b536b, #34495e); transform: translateY(-2px); border-bottom: 6px solid #1a252f; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .cell:active:not(.empty-cell) { transform: translateY(2px); border-bottom: 2px solid #1a252f; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        .cell.active { background: linear-gradient(135deg, #00f2fe, #4facfe); border-bottom: 4px solid #00a8cc; color: white; transform: scale(0.95); box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-shadow: none; }
        @keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(0.95); } }
        
        .cell.hint-region { border: 2px dashed #00f2fe; border-bottom: 6px dashed #00f2fe; box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.3), 0 0 15px rgba(0, 242, 254, 0.3); background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(79, 172, 254, 0.1)); }
        
        /* CLASS CỐT LÕI ĐỂ XÓA CHỮ UNDEFINED VÀ LÀM TRONG SUỐT CÁC Ô THỪA */
        .cell.empty-cell { background: transparent !important; border: none !important; box-shadow: none !important; cursor: default; color: transparent !important; }
        
        #message { margin-top: 30px; font-size: 26px; font-weight: 900; height: 30px; text-align: center; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        .controls { margin-top: 30px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        button.action-btn { padding: 12px 25px; font-size: 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; color: white; border: none; border-radius: 12px; transition: 0.1s; box-shadow: 0 6px 0 rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.3); }
        button.action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.3); }
        .btn-restart { background: linear-gradient(135deg, #ff416c, #ff4b2b); border-bottom: 4px solid #c0392b; }
        .btn-map { background: linear-gradient(135deg, #36d1dc, #5b86e5); border-bottom: 4px solid #2980b9; }
        .btn-next { background: linear-gradient(135deg, #11998e, #38ef7d); border-bottom: 4px solid #27ae60; display: none; }
    </style>
</head>
<body>

    <div id="lobby-screen" class="screen active">
        <h1 class="game-title">Arrow Chain</h1>
        <div class="subtitle">Giải mã mê cung - Khai mở trí tuệ</div>
        <button class="btn-play-now" onclick="openMapScreen()">Chơi Ngay</button>
    </div>

    <div id="map-screen" class="screen">
        <div class="map-header">
            <button class="btn-back" onclick="openLobbyScreen()">🔙 Thoát</button>
            <h2 class="map-title">Bản Đồ Kho Báu</h2>
            <div style="width: 80px;"></div> 
        </div>
        <div class="map-path-container" id="map-nodes"></div>
    </div>

    <div id="game-screen" class="screen">
        <div class="header" id="header-container">
            <h3 id="level-title">Cửa Số 1</h3>
            <button id="hint-btn" onclick="useHint()">💡 Gợi ý</button>
        </div>

        <div id="game-board"></div>
        <div id="message"></div>
        
        <div class="controls">
            <button class="action-btn btn-restart" onclick="initGame()">🔄 Chơi Lại</button>
            <button class="action-btn btn-map" onclick="openMapScreen()">🗺️ Về Bản Đồ</button>
            <button class="action-btn btn-next" id="next-btn" onclick="nextLevel()">⏭️ Màn Tiếp Theo</button>
        </div>
    </div>

    <!-- Nhúng file logic Map -->
    <script src="levels.js"></script>
    
    <script>
        // --- 1. CHUYỂN MÀN HÌNH ---
        function switchScreen(screenId) { 
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
            document.getElementById(screenId).classList.add('active'); 
        }
        function openLobbyScreen() { switchScreen('lobby-screen'); }
        function openMapScreen() { renderMap(); switchScreen('map-screen'); }
        function openGameScreen() { switchScreen('game-screen'); }

        // --- 2. LƯU TIẾN TRÌNH (LOCAL STORAGE) ---
        let highestUnlockedLevel = localStorage.getItem('arrowGameProgress') ? parseInt(localStorage.getItem('arrowGameProgress')) : 0;
        function unlockNextLevel(completedLevelIndex) {
            let nextIndex = completedLevelIndex + 1;
            if (nextIndex > highestUnlockedLevel && nextIndex < gameLevels.length) { 
                highestUnlockedLevel = nextIndex; 
                localStorage.setItem('arrowGameProgress', highestUnlockedLevel); 
            }
        }

        function renderMap() {
            const container = document.getElementById('map-nodes'); 
            container.innerHTML = '';
            for (let i = 0; i < gameLevels.length; i++) {
                let node = document.createElement('div'); node.classList.add('level-node');
                node.style.setProperty('--offset', (i % 2 === 0) ? '-60px' : '60px');
                let span = document.createElement('span'); span.innerText = i + 1; node.appendChild(span);
                
                // Cửa cuối cùng đổi màu đỏ cho nổi bật
                if(i == gameLevels.length - 1) {
                    node.style.background = "#e74c3c"; 
                    node.style.borderColor = "#c0392b";
                    node.style.color = "white";
                }

                if (i > highestUnlockedLevel) node.classList.add('locked');
                else node.onclick = () => { currentLevelIndex = i; openGameScreen(); initGame(); };
                container.appendChild(node);
            }
        }

        // --- 3. LOGIC TRÒ CHƠI CHÍNH ---
        let currentLevelIndex = 0, board = [], isPlaying = false, rows = 0, cols = 0, levelData = [];
        let winningCell = {r: 0, c: 0}, maxHints = 0, hintsUsed = 0, hintCooldown = false, cooldownTime = 15, cooldownInterval = null;
        let targetScore = 0; // Đếm số ô hợp lệ cần đi qua

        function nextLevel() { unlockNextLevel(currentLevelIndex); openMapScreen(); }

        function initGame() {
            levelData = gameLevels[currentLevelIndex];
            rows = levelData.length; cols = levelData[0].length;
            
            document.getElementById('level-title').innerText = currentLevelIndex === gameLevels.length - 1 ? `☠️ BOSS LEVEL` : `Cửa Số ${currentLevelIndex + 1}`;
            document.getElementById('next-btn').style.display = 'none';

            // Thu nhỏ kích thước UI khi Map lớn
            let cellSize = cols > 10 ? 35 : (cols > 6 ? 45 : 65);
            let fontSize = cols > 10 ? 14 : (cols > 6 ? 18 : 26);

            const boardElement = document.getElementById('game-board'); boardElement.innerHTML = '';
            boardElement.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
            boardElement.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
            
            // Giữ header luôn đủ rộng
            document.getElementById('header-container').style.width = `${Math.max(380, cols * (cellSize + 8))}px`;
            document.getElementById('message').innerText = '';
            
            isPlaying = false; board = []; targetScore = 0;

            for (let r = 0; r < rows; r++) {
                let rowArray = [];
                for (let c = 0; c < cols; c++) {
                    let cellData = levelData[r][c];
                    let cellDiv = document.createElement('div');
                    
                    cellDiv.style.width = `${cellSize}px`; cellDiv.style.height = `${cellSize}px`;
                    
                    // Tự động thu nhỏ font nếu ô đó ngã 3 ngã 4 (có nhiều mũi tên)
                    let finalFontSize = fontSize;
                    if (cellData.arrows && cellData.arrows.length > 2) {
                        finalFontSize = Math.max(10, fontSize - 6);
                    }
                    cellDiv.style.fontSize = `${finalFontSize}px`;
                    
                    if (cellData.empty) {
                        // Tàng hình các ô thừa
                        cellDiv.classList.add('cell', 'empty-cell');
                    } else {
                        targetScore++; // Chỉ đếm ô hợp lệ
                        cellDiv.classList.add('cell');
                        cellDiv.innerText = cellData.arrows;
                        cellDiv.onclick = () => startGame(r, c);
                    }
                    boardElement.appendChild(cellDiv);
                    rowArray.push({ element: cellDiv, dirs: cellData.dirs || [], visited: false, empty: cellData.empty });
                }
                board.push(rowArray);
            }

            // Tính số lượng gợi ý
            if (targetScore <= 16) maxHints = 1; else if (targetScore <= 36) maxHints = 2; else maxHints = 3;                        
            hintsUsed = 0; hintCooldown = false; clearInterval(cooldownInterval);
            
            findWinningCell(); 
            updateHintUI();
        }

        function findWinningCell() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    // Nếu bấm vào ô này mà ăn được toàn bộ Target Score thì đó là chìa khóa
                    if (!board[r][c].empty && simulateGame(r, c) === targetScore) { winningCell = {r, c}; return; }
                }
            }
        }

        function simulateGame(startR, startC) {
            let simVisited = Array(rows).fill().map(() => Array(cols).fill(false));
            let queue = [{ r: startR, c: startC }]; simVisited[startR][startC] = true;
            let visitedCount = 1;
            while (queue.length > 0) {
                let current = queue.shift(); let dirs = levelData[current.r][current.c].dirs || [];
                for (let dir of dirs) {
                    let nextR = current.r + dir[0], nextC = current.c + dir[1];
                    if (nextR >= 0 && nextR < rows && nextC >= 0 && nextC < cols && !levelData[nextR][nextC].empty) {
                        if (!simVisited[nextR][nextC]) { simVisited[nextR][nextC] = true; visitedCount++; queue.push({ r: nextR, c: nextC }); }
                    }
                }
            }
            return visitedCount;
        }

        // --- 4. HỆ THỐNG GỢI Ý KHOANH VÙNG NGẪU NHIÊN ---
        function useHint() {
            if (hintCooldown || hintsUsed >= maxHints || isPlaying) return;
            hintsUsed++; let hintsLeft = maxHints - hintsUsed; 
            
            for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) board[r][c].element.classList.remove('hint-region');
            
            let boxSize = hintsLeft === 0 ? 1 : (hintsLeft === 1 ? 3 : 5);
            let validMinR_start = Math.max(0, winningCell.r - boxSize + 1), validMinR_end = Math.max(0, Math.min(rows - boxSize, winningCell.r));
            let minR = Math.floor(Math.random() * (validMinR_end - validMinR_start + 1)) + validMinR_start, maxR = Math.min(rows - 1, minR + boxSize - 1);
            let validMinC_start = Math.max(0, winningCell.c - boxSize + 1), validMinC_end = Math.max(0, Math.min(cols - boxSize, winningCell.c));
            let minC = Math.floor(Math.random() * (validMinC_end - validMinC_start + 1)) + validMinC_start, maxC = Math.min(cols - 1, minC + boxSize - 1);

            for (let r = minR; r <= maxR; r++) {
                for (let c = minC; c <= maxC; c++) {
                    if(!board[r][c].empty) board[r][c].element.classList.add('hint-region');
                }
            }
            startHintCooldown();
        }

        function startHintCooldown() {
            if (hintsUsed >= maxHints) { updateHintUI(); return; }
            hintCooldown = true; let timeLeft = cooldownTime; updateHintUI(timeLeft);
            cooldownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) { clearInterval(cooldownInterval); hintCooldown = false; updateHintUI(); } else updateHintUI(timeLeft);
            }, 1000);
        }

        function updateHintUI(timeLeft = 0) {
            let btn = document.getElementById('hint-btn');
            if (hintsUsed >= maxHints) { btn.innerText = `💡 Hết gợi ý`; btn.disabled = true; } 
            else if (hintCooldown) { btn.innerText = `⏳ Chờ ${timeLeft}s`; btn.disabled = true; } 
            else { btn.innerText = `💡 Gợi ý (${hintsUsed}/${maxHints})`; btn.disabled = false; }
        }

        // --- 5. LOGIC CHẠY TÍN HIỆU KHI CHƠI ---
        async function startGame(startRow, startCol) {
            if (isPlaying) return; isPlaying = true; document.getElementById('hint-btn').disabled = true; 
            for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) board[r][c].element.classList.remove('hint-region');
            
            let queue = [{ r: startRow, c: startCol }]; board[startRow][startCol].visited = true;

            while (queue.length > 0) {
                let current = queue.shift(); let cell = board[current.r][current.c];
                cell.element.classList.add('active');
                
                // Tốc độ lan truyền tăng khi map to
                await new Promise(resolve => setTimeout(resolve, rows > 10 ? 50 : 200)); 
                
                for (let dir of cell.dirs) {
                    let nextR = current.r + dir[0], nextC = current.c + dir[1];
                    if (nextR >= 0 && nextR < rows && nextC >= 0 && nextC < cols && !board[nextR][nextC].empty) {
                        if (!board[nextR][nextC].visited) { board[nextR][nextC].visited = true; queue.push({ r: nextR, c: nextC }); }
                    }
                }
            }
            checkWinCondition();
        }

        function checkWinCondition() {
            let visitedCount = 0;
            for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { if (board[r][c].visited) visitedCount++; }
            const msg = document.getElementById('message');
            
            if (visitedCount === targetScore) {
                msg.innerText = "🎉 CHIẾN THẮNG!"; msg.style.color = "#00f2fe";
                if(currentLevelIndex < gameLevels.length - 1) document.getElementById('next-btn').style.display = 'block'; 
                unlockNextLevel(currentLevelIndex); 
            } else {
                msg.innerText = `❌ THUA RỒI! (Thiếu ${targetScore - visitedCount} ô)`; msg.style.color = "#ff416c";
            }
        }
    </script>
</body>
</html>
